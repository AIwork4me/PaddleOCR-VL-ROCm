name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.10"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python -m compileall -q src/paddleocr_vl_rocm eval
      - run: ruff check src tests scripts eval
      - run: ruff format --check src tests scripts eval
      - run: mypy src
      - run: python -m pytest -q -m "not gpu and not network and not integration"
      - run: python -m build

