name: Hardware report
description: Report setup, provider, or inference failures on a specific machine
title: "[Hardware]: "
labels: [hardware]
body:
  - type: input
    id: gpu
    attributes: {label: GPU or APU model}
    validations: {required: true}
  - type: input
    id: memory
    attributes: {label: Dedicated VRAM or shared memory}
    validations: {required: true}
  - type: input
    id: driver
    attributes: {label: AMD driver version}
    validations: {required: true}
  - type: input
    id: windows
    attributes: {label: Windows version and build}
    validations: {required: true}
  - type: input
    id: hip
    attributes: {label: HIP runtime version}
    validations: {required: true}
  - type: input
    id: python
    attributes: {label: Python version}
    validations: {required: true}
  - type: input
    id: runtime
    attributes: {label: llama.cpp build and commit}
    validations: {required: true}
  - type: input
    id: model_hash
    attributes: {label: Model SHA-256}
    validations: {required: true}
  - type: textarea
    id: command
    attributes: {label: Exact command}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor JSON
      description: Paste paddleocr-vl-rocm doctor --json output after removing user paths, endpoint credentials, private identifiers, and document data. Never include tokens or unredacted logs.
    validations: {required: true}

