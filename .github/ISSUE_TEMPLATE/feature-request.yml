name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is blocked or unnecessarily difficult?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: scope
    attributes:
      label: Compatibility and evidence impact
      description: Note affected operating systems, hardware paths, public contracts, or benchmark claims.
    validations: {required: true}
