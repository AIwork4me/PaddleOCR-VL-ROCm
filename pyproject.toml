[project]
name = "paddleocr-vl-rocm"
version = "0.1.0"
description = "Lightweight PaddleOCR-VL inference with ONNXRuntime layout and ROCm-backed OpenAI-compatible VLM serving."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26.0",
  "onnxruntime>=1.18.0",
  "opencv-python-headless>=4.9.0",
  "pillow>=10.0.0",
  "requests>=2.32.0",
  "rich>=13.0.0",
  "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
download = ["huggingface_hub>=0.25.0"]

[project.scripts]
paddleocr-vl-rocm = "paddleocr_vl_rocm.cli:main"
paddleocr-vl-rocm-check-server = "paddleocr_vl_rocm.server:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
