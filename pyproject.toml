[project]
name = "paddleocr-vl-rocm"
version = "0.1.1"
description = "Lightweight PaddleOCR-VL inference with ONNXRuntime layout and ROCm-backed OpenAI-compatible VLM serving."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{name = "AIwork4me"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["paddleocr", "document-ai", "ocr", "amd", "directml", "rocm", "hip"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26.0",
  "onnxruntime>=1.18.0; platform_system != 'Windows'",
  "onnxruntime-directml>=1.18.0; platform_system == 'Windows'",
  "opencv-python-headless>=4.9.0",
  "pillow>=10.0.0",
  "requests>=2.32.0",
  "rich>=13.0.0",
  "shapely>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/AIwork4me/PaddleOCR-VL-ROCm"
Repository = "https://github.com/AIwork4me/PaddleOCR-VL-ROCm"
Issues = "https://github.com/AIwork4me/PaddleOCR-VL-ROCm/issues"
Changelog = "https://github.com/AIwork4me/PaddleOCR-VL-ROCm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "pytest==9.1.1",
  "ruff==0.15.19",
  "mypy==2.1.0",
  "PyYAML==6.0.2",
  "tomli==2.2.1; python_version < '3.11'",
]
platform = ["omnidocbench-rocm>=0.2.0"]
download = ["huggingface_hub>=0.25.0"]
gpu = ["onnxruntime-directml>=1.18.0; platform_system == 'Windows'"]
# Note: OmniDocBench's own dependencies (including CDM's Node.js, ImageMagick 7,
# and TeX Live toolchain) are NOT vendored here. They live in the OmniDocBench
# checkout pinned at eval/.omnidocbench/ (gitignored) and installed via its own
# `pip install -e .`; the eval stage runs `pdf_validation.py` from that checkout.
# No `eval` extra is needed on our side: the only extra dep the eval/ scripts
# import is `huggingface_hub`, already provided by the `download` extra above.
# See eval/README.md for the Docker image and the "drop CDM" fallback.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["models", "outputs", "eval/.omnidocbench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.setuptools.package-data]
paddleocr_vl_rocm = ["assets/*.json"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["src/paddleocr_vl_rocm"]

# Task 1 baseline: pre-existing untyped OTSL table-parsing logic uses
# heterogeneous dicts whose values mypy widens to ``object``, producing
# cascading arg-type/operator/call-overload errors in the ``_otsl_to_table``
# region. This is legacy logic that will be hardened in a later task; it is
# suppressed here only to establish a clean baseline.
# Task 5 moved the OTSL table-parsing code (constants + four functions)
# verbatim from pipeline_core into table, carrying the same pre-existing
# findings; that module is covered here. pipeline_core itself is now clean
# and no longer needs the override.
# Task 4 moved image-I/O helpers (e.g. ``_crop``'s ``tuple(float(v) for v in ...)``)
# from pipeline_core verbatim into imageio, carrying the same pre-existing
# arg-type finding; that module is covered here too.
[[tool.mypy.overrides]]
module = ["paddleocr_vl_rocm.table", "paddleocr_vl_rocm.imageio"]
disable_error_code = [
    "arg-type",
    "assignment",
    "call-overload",
    "index",
    "operator",
    "type-var",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: tests that need onnxruntime / DirectML / GPU",
    "network: tests that make HTTP requests",
    "integration: tests that run external scripts or subprocess",
]

[project.scripts]
paddleocr-vl-rocm = "paddleocr_vl_rocm.cli:main"
paddleocr-vl-rocm-check-server = "paddleocr_vl_rocm.server:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
